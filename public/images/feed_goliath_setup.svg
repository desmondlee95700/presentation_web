<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" font-family="Fredoka, Outfit, 'Arial Rounded MT Bold', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a3412"/>
    </marker>
    <marker id="pointer" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57534e"/>
    </marker>
  </defs>

  <!-- Paper card -->
  <rect width="900" height="1200" fill="#fbf8f1"/>
  <rect x="20" y="20" width="860" height="1160" rx="36" fill="#fff8f3" stroke="#f8cec4" stroke-width="3"/>

  <!-- Title pill -->
  <rect x="250" y="48" width="400" height="76" rx="38" fill="#ea580c"/>
  <text x="450" y="99" text-anchor="middle" font-size="40" font-weight="700" fill="#fff">Setup Diagram</text>

  <!-- Scene: sanctuary wall and floor -->
  <clipPath id="scene"><rect x="50" y="150" width="800" height="710" rx="26"/></clipPath>
  <g clip-path="url(#scene)">
    <rect x="50" y="150" width="800" height="570" fill="#fdf1e7"/>
    <rect x="50" y="720" width="800" height="140" fill="#ecd3b6"/>
    <line x1="50" y1="720" x2="850" y2="720" stroke="#c9a37c" stroke-width="4"/>
    <!-- Arched windows -->
    <path d="M90,420 V250 Q90,200 135,200 Q180,200 180,250 V420 Z" fill="#fef9f0" stroke="#f3d9c4" stroke-width="4"/>
    <line x1="135" y1="205" x2="135" y2="420" stroke="#f3d9c4" stroke-width="3"/>
    <path d="M390,400 V250 Q390,205 430,205 Q470,205 470,250 V400 Z" fill="#fef9f0" stroke="#f3d9c4" stroke-width="4"/>
    <line x1="430" y1="210" x2="430" y2="400" stroke="#f3d9c4" stroke-width="3"/>
  </g>
  <rect x="50" y="150" width="800" height="710" rx="26" fill="none" stroke="#f8cec4" stroke-width="3"/>

  <!-- Table -->
  <rect x="555" y="560" width="250" height="20" rx="5" fill="#a16207"/>
  <rect x="575" y="580" width="16" height="140" fill="#854d0e"/>
  <rect x="769" y="580" width="16" height="140" fill="#854d0e"/>

  <!-- Goliath box -->
  <polygon points="770,330 800,308 800,540 770,560" fill="#c2925a"/>
  <polygon points="590,330 620,308 800,308 770,330" fill="#e2bb83"/>
  <rect x="590" y="330" width="180" height="230" fill="#d6a86a" stroke="#b98545" stroke-width="3"/>
  <!-- Face -->
  <ellipse cx="680" cy="440" rx="66" ry="72" fill="#f6d0b1"/>
  <path d="M614,452 Q616,545 680,552 Q744,545 746,452 Q728,478 680,478 Q632,478 614,452 Z" fill="#7c4a24"/>
  <path d="M612,418 Q612,350 680,350 Q748,350 748,418 Z" fill="#94a3b8"/>
  <rect x="608" y="410" width="144" height="14" rx="4" fill="#64748b"/>
  <rect x="674" y="400" width="12" height="42" rx="3" fill="#64748b"/>
  <circle cx="653" cy="445" r="6" fill="#1f2937"/>
  <circle cx="707" cy="445" r="6" fill="#1f2937"/>
  <path d="M640,432 L664,438 M720,432 L696,438" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="680" cy="500" rx="34" ry="27" fill="#1c1917"/>

  <!-- Tape throwing line -->
  <rect x="306" y="713" width="40" height="12" rx="2" fill="#3b82f6"/>

  <!-- Basket of paper balls -->
  <circle cx="168" cy="680" r="12" fill="#ffffff" stroke="#d6d3d1" stroke-width="2"/>
  <circle cx="190" cy="676" r="12" fill="#ffffff" stroke="#d6d3d1" stroke-width="2"/>
  <circle cx="212" cy="681" r="12" fill="#ffffff" stroke="#d6d3d1" stroke-width="2"/>
  <path d="M148,686 H232 L222,720 H158 Z" fill="#d97706" stroke="#92400e" stroke-width="3"/>
  <path d="M160,698 H220 M163,709 H217" stroke="#92400e" stroke-width="2"/>

  <!-- Helper -->
  <line x1="88" y1="660" x2="80" y2="718" stroke="#334155" stroke-width="12" stroke-linecap="round"/>
  <line x1="104" y1="660" x2="112" y2="718" stroke="#334155" stroke-width="12" stroke-linecap="round"/>
  <rect x="74" y="580" width="44" height="88" rx="16" fill="#0d9488"/>
  <line x1="114" y1="598" x2="148" y2="640" stroke="#0d9488" stroke-width="11" stroke-linecap="round"/>
  <circle cx="96" cy="552" r="25" fill="#f6d0b1"/>

  <!-- Kid (David) -->
  <line x1="262" y1="682" x2="256" y2="718" stroke="#334155" stroke-width="10" stroke-linecap="round"/>
  <line x1="276" y1="682" x2="282" y2="718" stroke="#334155" stroke-width="10" stroke-linecap="round"/>
  <rect x="252" y="622" width="34" height="66" rx="13" fill="#f97316"/>
  <line x1="282" y1="634" x2="300" y2="600" stroke="#f97316" stroke-width="9" stroke-linecap="round"/>
  <circle cx="269" cy="602" r="20" fill="#f6d0b1"/>
  <circle cx="302" cy="590" r="9" fill="#ffffff" stroke="#d6d3d1" stroke-width="2"/>

  <!-- Throw path -->
  <path d="M310,582 Q480,300 655,488" fill="none" stroke="#ea580c" stroke-width="4" stroke-dasharray="10 9" marker-end="url(#arrow)"/>

  <!-- Distance -->
  <line x1="330" y1="770" x2="553" y2="770" stroke="#9a3412" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="326" y1="728" x2="326" y2="782" stroke="#9a3412" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="557" y1="728" x2="557" y2="782" stroke="#9a3412" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="442" y="812" text-anchor="middle" font-size="26" font-weight="700" fill="#9a3412">4 feet</text>

  <!-- Labels -->
  <g font-size="21" fill="#44403c" font-weight="600">
    <text x="680" y="250" text-anchor="middle">Goliath box (target)</text>
    <line x1="680" y1="262" x2="680" y2="302" stroke="#57534e" stroke-width="2" marker-end="url(#pointer)"/>

    <text x="572" y="532" text-anchor="end">Mouth hole</text>
    <line x1="578" y1="525" x2="640" y2="508" stroke="#57534e" stroke-width="2" marker-end="url(#pointer)"/>

    <text x="680" y="660" text-anchor="middle">Table</text>

    <text x="326" y="846" text-anchor="middle">Tape line</text>

    <text x="190" y="846" text-anchor="middle">Paper balls</text>
    <line x1="190" y1="826" x2="190" y2="728" stroke="#57534e" stroke-width="2" marker-end="url(#pointer)"/>

    <text x="96" y="505" text-anchor="middle">Helper</text>
    <text x="269" y="562" text-anchor="middle">Kid</text>
  </g>

  <!-- Steps -->
  <g font-size="27" fill="#292524">
    <text x="80" y="922"><tspan font-weight="700" fill="#ea580c">1.</tspan> Place the Goliath box on a table.</text>
    <text x="80" y="968"><tspan font-weight="700" fill="#ea580c">2.</tspan> Tape a throwing line 4 feet away.</text>
    <text x="80" y="1014"><tspan font-weight="700" fill="#ea580c">3.</tspan> Fill a basket with crumpled A4 paper balls.</text>
    <text x="80" y="1060"><tspan font-weight="700" fill="#ea580c">4.</tspan> Kids take turns throwing into Goliath’s mouth.</text>
    <text x="80" y="1106"><tspan font-weight="700" fill="#ea580c">5.</tspan> Helpers line kids up and help them aim.</text>
  </g>
</svg>
